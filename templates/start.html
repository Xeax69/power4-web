<!DOCTYPE html> 
<html lang="fr">
    <head> 
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{.Title}} - Puissance 4</title>
        <link rel="icon" href="data:,">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/static/css/main.css?v=2025101704">
    </head>
    <body> 
        <header> 
            <h1>◉ POWER4.EXE ◉</h1>
        </header>
        <main>
<div class="start-container">
    <div class="welcome-section">
        <h2>🎮 Bienvenue sur le jeu du Puissance 4 🎮</h2>
        <p>C'est partie pour le tryhard</p>
    </div>

    <form method="POST" action="/start-game" class="start-form">
        <div class="players-section">
            <h3>👥 Joueurs</h3>
            
            <div class="player-input">
                <label for="player1">🔴 Joueur 1 (Rouge) :</label>
                <input type="text" id="player1" name="player1" required 
                       placeholder="Entrez votre nom" maxlength="20">
            </div>
            
            <div class="player-input">
                <label for="player2">🟡 Joueur 2 (Jaune) :</label>
                <input type="text" id="player2" name="player2" required 
                       placeholder="Entrez votre nom" maxlength="20">
            </div>
        </div>

        <div class="difficulty-section">
            <h3>⚡ Choisissez la difficulté</h3>
            
            <div class="difficulty-options">
                <label class="difficulty-option">
                    <input type="radio" name="difficulty" value="easy" checked>
                    <div class="difficulty-card easy">
                        <h4>😊 Facile</h4>
                        <p>Grille 6x7</p>
                        <span class="recommended">Recommandé pour débuter</span>
                    </div>
                </label>
                
                <label class="difficulty-option">
                    <input type="radio" name="difficulty" value="normal">
                    <div class="difficulty-card normal">
                        <h4>😎 Normal</h4>
                        <p>Grille 6x9</p>
                        <span class="recommended">Difficulté équilibrée</span>
                    </div>
                </label>
                
                <label class="difficulty-option">
                    <input type="radio" name="difficulty" value="hard">
                    <div class="difficulty-card hard">
                        <h4>😤 Difficile</h4>
                        <p>Grille 8x9</p>
                        <span class="recommended">Pour les experts</span>
                    </div>
                </label>
            </div>
        </div>

        <div class="start-section">
            <button type="submit" class="start-btn">
                🚀 Go jouer l'équipe
            </button>
        </div>
    </form>
</div>
        </main>
        <footer> 
            <p> Jeu de Noé en go</p>
        </footer>
    </body>
</html>
